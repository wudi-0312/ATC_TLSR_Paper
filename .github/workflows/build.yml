name: Build ATC Paper Direct
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Dummy Firmware
        run: |
          python3 -c 'import struct; f=open("Firmware/ATC_Paper.bin","wb"); f.write(b"\x4B\x10" + struct.pack("<I", 0x40000) + b"\x00" * (0x40000 - 6)); f.close()'
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ATC_Paper.bin
          path: Firmware/ATC_Paper.bin
